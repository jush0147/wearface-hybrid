name: Wear OS emulator smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow for screenshot analysis
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<13'

      - name: Generate copyright-safe placeholder assets
        run: python scripts/prepare_assets.py

      - uses: android-actions/setup-android@v4

      - name: Install compile SDK and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Build placeholder APK
        run: gradle :watchface:assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Wear OS emulator, install APK, capture screens
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-wear
          arch: x86_64
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none
          script: bash scripts/wear-emulator-smoke.sh

      - name: Upload screenshots, logs, and smoke-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wear-emulator-screenshots
          path: emulator-results/
          if-no-files-found: warn
          retention-days: 7
